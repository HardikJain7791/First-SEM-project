<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to GNAN Tuition Classes — Welcome back to your learning journey.">
  <title>Log In | GNAN Tuition Classes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

  <div class="login-card">

    <div class="auth-icon">🔐</div>

    <span class="eyebrow">Welcome Back</span>
    <h1 style="font-size:2.2rem; margin: 8px 0 6px; line-height:1.05;">Log in to GNAN</h1>
    <p style="color:var(--muted); font-size:14px; margin-bottom:32px;">Continue your learning journey right where you left off.</p>

    <form>

      <div class="form-group">
        <label for="login-email">Email Address</label>
        <div class="input-wrap">
          <span class="input-icon">✉</span>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="login-password">Password</label>
          <a href="#" class="label-hint" style="color:var(--orange-soft); font-weight:600;">Forgot password?</a>
        </div>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="login-password" placeholder="Enter your password" required>
        </div>
      </div>

      <div class="login-meta">
        <label>
          <input type="checkbox" id="remember" style="accent-color:var(--orange);">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn-submit">
        Log In &nbsp;→
      </button>

    </form>

    <div class="form-footer">
      Don't have an account? <a href="signup.html">Sign Up</a>
      <br>
      <a href="index.html" class="back-link">← Back to Home</a>
    </div>

  </div>

</body>
</html>
